name: Update views.json

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fetch traffic
        run: |
          curl -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" \
               -H "Accept: application/vnd.github+json" \
               https://api.github.com/repos/KamilDziuk/blog/traffic/views \
               > views.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add views.json
          git commit -m "Update views" || echo "No changes"
          git push https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/KamilDziuk/blog.git
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}